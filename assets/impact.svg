<text x="668" y="268" class="v" fill="#F0883E" opacity="0">65 → 90+<animate attributeName="opacity" from="0" to="1" begin="2.10s" dur="0.5s" fill="freeze"/></text><text x="28" y="315" class="t">Dashboard load</text><text x="28" y="332" class="s">6 s → 2 s · JSRS</text>
