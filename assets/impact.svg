<svg xmlns="http://www.w3.org/2000/svg" width="860" height="358" viewBox="0 0 860 358" role="img" aria-label="Animated impact metrics">
<style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif} .t{fill:#E6EDF3;font-size:14px;font-weight:600} .s{fill:#8B949E;font-size:11px} .v{font-size:17px;font-weight:800} .h{fill:#E6EDF3;font-size:16px;font-weight:700}</style>
<rect width="860" height="358" rx="14" fill="#0D1117" stroke="#30363D"/>
<text x="28" y="36" class="h">📈 Impact, measured in production</text>
<text x="28" y="75" class="t">Contract review time</text><text x="28" y="92" class="s">30 min → 10 min · JSRS</text>
<rect x="230" y="62" width="420" height="16" rx="8" fill="#21262D"/>
<rect x="230" y="62" width="0" height="16" rx="8" fill="#F778BA"><animate attributeName="width" from="0" to="281" begin="0.30s" dur="1.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/></rect>
<text x="668" y="76" class="v" fill="#F778BA" opacity="0">−67%<animate attributeName="opacity" from="0" to="1" begin="1.10s" dur="0.5s" fill="freeze"/></text><text x="28" y="123" class="t">Search time</text><text x="28" y="140" class="s">RAG semantic search · RABT</text>
<rect x="230" y="110" width="420" height="16" rx="8" fill="#21262D"/>
