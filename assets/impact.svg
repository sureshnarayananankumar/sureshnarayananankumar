<rect x="230" y="206" width="420" height="16" rx="8" fill="#21262D"/>
<rect x="230" y="206" width="0" height="16" rx="8" fill="#3FB950"><animate attributeName="width" from="0" to="147" begin="1.05s" dur="1.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/></rect>
<text x="668" y="220" class="v" fill="#3FB950" opacity="0">−35%<animate attributeName="opacity" from="0" to="1" begin="1.85s" dur="0.5s" fill="freeze"/></text><text x="28" y="267" class="t">Lighthouse score</text><text x="28" y="284" class="s">Angular 22 SSR · RABT</text>
<rect x="230" y="254" width="420" height="16" rx="8" fill="#21262D"/>
