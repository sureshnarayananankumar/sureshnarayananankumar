<svg xmlns="http://www.w3.org/2000/svg" width="280" height="96" viewBox="0 0 280 96" role="img" aria-label="Just exploring">
<defs><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F778BA" stop-opacity=".22"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
<clipPath id="c"><rect x="2" y="2" width="276" height="92" rx="16"/></clipPath></defs>
<rect x="2" y="2" width="276" height="92" rx="16" fill="#0D1117"/>
<g clip-path="url(#c)"><rect width="280" height="96" fill="url(#bg)"/>
<rect x="-120" y="-20" width="80" height="136" fill="url(#sh)" transform="skewX(-20)"><animate attributeName="x" values="-120;340;340" keyTimes="0;.45;1" dur="3.2s" repeatCount="indefinite"/></rect></g>
<rect x="2" y="2" width="276" height="92" rx="16" fill="none" stroke="#F778BA" stroke-width="2"><animate attributeName="stroke-opacity" values="1;.35;1" dur="2.2s" repeatCount="indefinite"/></rect>
